name: Process Watering Records

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update records'
        required: false
        default: 'false'

jobs:
  process-records:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Process records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 安装必要的依赖
          npm install @actions/core @actions/github
          
          cat > process-records.js << 'EOF'
          const fs = require('fs');
          const core = require('@actions/core');
          const github = require('@actions/github');
          
          // 配置
          const repo = process.env.GITHUB_REPOSITORY;
          const [owner, repoName] = repo.split('/');
          const token = process.env.GITHUB_TOKEN;
          const outputFile = 'data/records.json';
          const requiredLabel = 'watering-record';
          
          // 创建Octokit客户端
          const octokit = github.getOctokit(token);
          
          async function getAllWateringRecordIssues() {
            try {
              const issues = await octokit.paginate(octokit.rest.issues.listForRepo, {
                owner,
                repo: repoName,
                state: 'all',
                labels: requiredLabel,
                per_page: 100
              });
              
              core.info(`Found ${issues.length} watering record issues`);
              return issues;
            } catch (error) {
              core.error(`Error fetching issues: ${error}`);
              return [];
            }
          }
          
          function extractRecordFromIssue(issue) {
            const record = {
              id: issue.number.toString(),
              issue_number: issue.number,
              issue_title: issue.title,
              issue_url: issue.html_url,
              created_at: issue.created_at,
              updated_at: issue.updated_at,
              state: issue.state,
              labels: issue.labels.map(label => label.name)
            };
            
            // 从Issue内容中提取数据
            if (issue.body) {
              const fields = {
                type: /\*\*花卉种类\*\*:\s*(.*?)(?:\r?\n|$)/,
                date: /\*\*浇水日期\*\*:\s*(.*?)(?:\r?\n|$)/,
                user: /\*\*记录人\*\*:\s*(.*?)(?:\r?\n|$)/,
                timestamp: /\*\*时间戳\*\*:\s*(.*?)(?:\r?\n|$)/,
                custom_id: /\*\*记录ID\*\*:\s*(.*?)(?:\r?\n|$)/
              };
              
              for (const [field, regex] of Object.entries(fields)) {
                const match = issue.body.match(regex);
                if (match) record[field] = match[1].trim();
              }
              
              if (record.custom_id) record.id = record.custom_id;
            }
            
            // 从标题中提取信息（备用）
            if (!record.type && issue.title.includes(':')) {
              const titleParts = issue.title.split(':');
              if (titleParts.length > 1 && titleParts[1].includes('-')) {
                const typeParts = titleParts[1].split('-');
                if (typeParts.length > 0) record.type = typeParts[0].trim();
                if (typeParts.length > 1) record.user = typeParts[1].trim();
              }
            }
            
            return record;
          }
          
          async function main() {
            try {
              // 获取所有带标签的Issues
              const issues = await getAllWateringRecordIssues();
              
              if (issues.length === 0) {
                core.info('No watering record issues found. Creating empty records file.');
                fs.writeFileSync(outputFile, '[]');
                return;
              }
              
              // 处理每个Issue
              const records = issues.map(issue => {
                core.info(`Processing issue #${issue.number}: ${issue.title}`);
                return extractRecordFromIssue(issue);
              }).filter(record => record.type); // 只保留有花卉类型的记录
              
              // 按时间排序（最新的在前）
              records.sort((a, b) => {
                const dateA = a.timestamp ? new Date(a.timestamp) : new Date(a.created_at);
                const dateB = b.timestamp ? new Date(b.timestamp) : new Date(b.created_at);
                return dateB - dateA;
              });
              
              // 写入文件
              core.info(`Writing ${records.length} records to ${outputFile}`);
              fs.writeFileSync(outputFile, JSON.stringify(records, null, 2));
              
              // 提交更改
              core.info('Committing changes...');
              await require('child_process').execSync('git config --global user.name "GitHub Actions"');
              await require('child_process').execSync('git config --global user.email "actions@github.com"');
              await require('child_process').execSync('git add data/records.json');
              await require('child_process').execSync(`git commit -m "Update records from issues (${new Date().toISOString()})"`);
              await require('child_process').execSync('git push');
              
              core.info('Records processing completed successfully');
            } catch (error) {
              core.error(`Error processing records: ${error}`);
              // 创建空记录文件，避免页面加载错误
              fs.writeFileSync(outputFile, '[]');
            }
          }
          
          main();
          EOF
          
          node process-records.js
      
      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/records.json
          git diff --staged --quiet || (git commit -m "Update records from issues [skip ci]" && git push)
