name: Process Watering Records

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

jobs:
  process-records:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Create simple records processor
        run: |
          cat > process-records.js << 'EOF'
          const fs = require('fs');
          const https = require('https');
          
          // 配置
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const outputFile = 'data/records.json';
          
          console.log('Starting records processing...');
          console.log(`Repository: ${repo}`);
          
          // 简单的API请求函数
          function makeRequest(options) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                
                res.on('data', (chunk) => {
                  data += chunk;
                });
                
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      resolve(data);
                    }
                  } else {
                    console.error(`HTTP Error: ${res.statusCode}`);
                    console.error(`Response: ${data}`);
                    reject(new Error(`HTTP Error: ${res.statusCode}`));
                  }
                });
              });
              
              req.on('error', (e) => {
                console.error(`Request error: ${e.message}`);
                reject(e);
              });
              
              req.end();
            });
          }
          
          // 获取带有特定标签的Issues
          async function getWateringRecordIssues() {
            console.log('Fetching issues...');
            
            const options = {
              hostname: 'api.github.com',
              path: `/repos/${repo}/issues?state=open&labels=watering-record&per_page=100`,
              method: 'GET',
              headers: {
                'User-Agent': 'GitHub-Action-Script',
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': `token ${token}`
              }
            };
            
            try {
              const issues = await makeRequest(options);
              console.log(`Found ${issues.length} watering record issues`);
              return issues;
            } catch (error) {
              console.error('Error fetching issues:', error);
              return [];
            }
          }
          
          // 从Issue内容中提取记录数据
          function extractRecordFromIssue(issue) {
            const record = {
              id: Date.now().toString() + '-' + issue.number,
              issue_number: issue.number,
              issue_title: issue.title,
              issue_url: issue.html_url,
              created_at: issue.created_at,
              updated_at: issue.updated_at
            };
            
            // 尝试从Issue内容中提取数据
            if (issue.body) {
              const typeMatch = issue.body.match(/\*\*花卉种类\*\*:\s*(.*?)(?:\r?\n|$)/);
              if (typeMatch) record.type = typeMatch[1].trim();
              
              const dateMatch = issue.body.match(/\*\*浇水日期\*\*:\s*(.*?)(?:\r?\n|$)/);
              if (dateMatch) record.date = dateMatch[1].trim();
              
              const userMatch = issue.body.match(/\*\*记录人\*\*:\s*(.*?)(?:\r?\n|$)/);
              if (userMatch) record.user = userMatch[1].trim();
              
              const timestampMatch = issue.body.match(/\*\*时间戳\*\*:\s*(.*?)(?:\r?\n|$)/);
              if (timestampMatch) record.timestamp = timestampMatch[1].trim();
              
              const idMatch = issue.body.match(/\*\*记录ID\*\*:\s*(.*?)(?:\r?\n|$)/);
              if (idMatch) record.id = idMatch[1].trim();
            }
            
            // 从标题中提取信息（如果内容中没有）
            if (!record.type && issue.title.includes(':')) {
              const titleParts = issue.title.split(':');
              if (titleParts.length > 1 && titleParts[1].includes('-')) {
                const typeParts = titleParts[1].split('-');
                if (typeParts.length > 0) record.type = typeParts[0].trim();
                if (typeParts.length > 1) record.user = typeParts[1].trim();
              }
            }
            
            return record;
          }
          
          // 主函数
          async function main() {
            try {
              // 获取Issues
              const issues = await getWateringRecordIssues();
              
              if (issues.length === 0) {
                console.log('No watering record issues found. Creating empty records file.');
                fs.writeFileSync(outputFile, '[]');
                return;
              }
              
              // 处理每个Issue
              const records = issues.map(issue => {
                console.log(`Processing issue #${issue.number}: ${issue.title}`);
                return extractRecordFromIssue(issue);
              });
              
              // 按时间排序（最新的在前）
              records.sort((a, b) => {
                const dateA = a.timestamp ? new Date(a.timestamp) : new Date(a.created_at);
                const dateB = b.timestamp ? new Date(b.timestamp) : new Date(b.created_at);
                return dateB - dateA;
              });
              
              // 写入文件
              console.log(`Writing ${records.length} records to ${outputFile}`);
              fs.writeFileSync(outputFile, JSON.stringify(records, null, 2));
              console.log('Records processing completed successfully');
            } catch (error) {
              console.error('Error processing records:', error);
              // 创建空记录文件，避免页面加载错误
              fs.writeFileSync(outputFile, '[]');
              // 不抛出错误，让工作流继续
            }
          }
          
          // 执行主函数
          main();
          EOF
          
          echo "Running records processor..."
          node process-records.js
      
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/records.json
          git diff --staged --quiet || (git commit -m "Update records from issues [skip ci]" && git push)
